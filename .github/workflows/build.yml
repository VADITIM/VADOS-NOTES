name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test NotesCore
        working-directory: ios/NotesCore
        run: swift test

  ipad:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test NotesCore
        working-directory: ios/NotesCore
        run: swift test
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iPad devices
        working-directory: ios
        run: xcodebuild -project VadosNotes.xcodeproj -scheme VadosNotes -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/VadosNotes.app package/Payload/
          cd package && zip -qry ../VadosNotes-iPad-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipad
          path: ios/VadosNotes-iPad-unsigned.ipa

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Install Tauri CLI
        working-directory: windows
        run: npm ci
      - name: Build installer
        working-directory: windows
        run: npx tauri build
      - name: Collect Windows files
        shell: bash
        run: |
          mkdir -p out
          cp windows/src-tauri/target/release/vados-notes.exe out/VadosNotes-portable.exe
          cp windows/src-tauri/target/release/bundle/nsis/*.exe out/
          cp windows/src-tauri/target/release/bundle/msi/*.msi out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Install Tauri CLI
        working-directory: windows
        run: npm ci
      - name: Build Linux bundles
        working-directory: windows
        run: npx tauri build --bundles appimage,deb
      - name: Collect Linux files
        shell: bash
        run: |
          mkdir -p out
          cp windows/src-tauri/target/release/bundle/appimage/*.AppImage out/
          cp windows/src-tauri/target/release/bundle/deb/*.deb out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [core-linux, ipad, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VADOS Notes (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows, Linux and iPad builds of commit ${{ github.sha }}.

            **Windows**
            - **VadosNotes-portable.exe**: download and run, nothing is installed.
            - **VADOS Notes_*_x64-setup.exe**: installer with a Start menu entry.
            - **.msi**: the same installer for MSI deployment.

            Windows SmartScreen warns about an unsigned app the first time: More info, then Run anyway.

            **Linux**
            - **.AppImage**: `chmod +x` it and run it.
            - **.deb**: `sudo apt install ./vados-notes_*.deb`.

            **iPad**
            - **VadosNotes-iPad-unsigned.ipa**: unsigned. Install it from Windows with Sideloadly (or AltStore) and a free Apple ID; the free signature lasts 7 days, then sideload again.
          files: out/*
