name: ios

on:
  push:
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test NotesCore
        working-directory: ios/NotesCore
        run: swift test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test NotesCore
        working-directory: ios/NotesCore
        run: swift test
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iPad devices
        working-directory: ios
        run: xcodebuild -project VadosNotes.xcodeproj -scheme VadosNotes -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/VadosNotes.app package/Payload/
          cd package && zip -qry ../VadosNotes-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VadosNotes-unsigned-ipa
          path: ios/VadosNotes-unsigned.ipa
