name: windows

on:
  push:
    paths:
      - "windows/**"
      - "shared/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "shared/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Install Tauri CLI
        working-directory: windows
        run: npm ci
      - name: Build installer
        working-directory: windows
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: VadosNotes-windows-installer
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        with:
          name: VadosNotes-windows-portable
          path: windows/src-tauri/target/release/vados-notes.exe
      - name: Name the portable build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: cp windows/src-tauri/target/release/vados-notes.exe VadosNotes-portable.exe
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: VADOS Notes for Windows (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows build of commit ${{ github.sha }}.

            - **VadosNotes-portable.exe**: download and run, nothing is installed.
            - **VADOS Notes_*_x64-setup.exe**: installer with a Start menu entry.
            - **.msi**: the same installer for MSI deployment.

            Windows SmartScreen warns about an unsigned app the first time: More info, then Run anyway.
          files: |
            VadosNotes-portable.exe
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi
